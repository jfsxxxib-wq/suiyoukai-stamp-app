<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>端末復旧 | 水曜会 花記録</title>
  <link rel="stylesheet" href="recovery.css">
</head>
<body>
  <main class="recovery-shell">
    <section class="recovery-phone" aria-labelledby="recovery-title">
      <header class="recovery-appbar"><span aria-hidden="true">✿</span><strong>水曜会 花記録</strong></header>
      <div class="recovery-content" id="recovery-content" aria-live="polite">
        <h1 id="recovery-title">既存記録を確認しています</h1>
        <p class="recovery-lead">新規登録や新しい番号の発行は行いません。</p>
        <p class="recovery-message">最初の成功結果がある場合は、同じ結果だけを再表示します。</p>
      </div>
    </section>
  </main>
  <script type="module" src="recovery-client.js"></script>
</body>
</html>
