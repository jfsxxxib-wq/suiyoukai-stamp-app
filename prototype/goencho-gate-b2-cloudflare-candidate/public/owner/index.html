<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>一局のご縁帳｜管理端末 Gate B1</title>
  <link rel="stylesheet" href="/shared/styles.css" />
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div><p class="eyebrow">GATE B1・LOCALHOST完全隔離</p><h1>一局のご縁帳　管理端末</h1></div>
      <span class="badge">架空データのみ</span>
    </header>
    <div class="notice"><strong>正式環境には接続していません。</strong> この候補では、管理端末登録・先生登録・端末承認のlocal動作だけを確認します。</div>
    <section class="shell">
      <nav class="steps" aria-label="管理画面">
        <button type="button" data-screen="1">1 初回登録</button>
        <button type="button" data-screen="2">2 復旧コード</button>
        <button type="button" data-screen="3">3 紛失復旧</button>
        <button type="button" data-screen="4">4 先生登録</button>
        <button type="button" data-screen="5">5 承認待ち</button>
        <button type="button" data-screen="6">6 端末承認</button>
      </nav>
      <div class="phone">
        <div class="speaker" aria-hidden="true"></div>
        <div id="screen" aria-live="polite" aria-busy="true"></div>
      </div>
    </section>
    <p id="app-status" class="sr-only" role="status" aria-live="polite"></p>
  </main>

  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <form method="dialog" class="dialog-card">
      <p class="step-chip" id="confirm-kind">最終確認</p>
      <h2 id="confirm-title">操作を確認</h2>
      <p id="confirm-message"></p>
      <div class="dialog-actions">
        <button class="secondary" value="cancel">戻る</button>
        <button class="danger" value="confirm" id="confirm-action">実行する</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/owner/owner.js"></script>
</body>
</html>
